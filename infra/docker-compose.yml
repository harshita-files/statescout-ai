version: '3.8'

services:
  # Neo4j Graph Database
  # Persistent storage for explored execution states and policies
  neo4j:
    image: neo4j:5-community
    container_name: statescout-neo4j
    ports:
      - "7474:7474" # Neo4j Browser HTTP UI
      - "7687:7687" # Bolt Protocol (driver connectivity)
    environment:
      # NOTE: For local setup simplicity, default credentials are set here.
      # WARNING: Move these variables to a .env file and reference them via env_file/variables
      # before deploying or sharing the environment.
      - NEO4J_AUTH=neo4j/testpassword123
      - NEO4J_PLUGINS=["apoc"] # Optional utility library commonly used for graphs
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  # Redis Session Cache
  # In-memory cache for tracking visited state-action pairs (deduplication)
  redis:
    image: redis:7-alpine
    container_name: statescout-redis
    ports:
      - "6379:6379" # Redis default port
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  redis_data:
    driver: local