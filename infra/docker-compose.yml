version: '3.8'

# StateScout AI — local development stack
# Usage:  docker compose -f infra/docker-compose.yml up -d
#
# Services:
#   neo4j  — graph DB (Bolt :7687, browser :7474)
#   redis  — visited-state cache (:6379)
#   api    — FastAPI reporting backend & Audit Console (:8000)

services:
  # Neo4j Graph Database
  # Persistent storage for explored execution states and policies
  neo4j:
    image: neo4j:5.20-community
    container_name: statescout-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-testpassword123}
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1g
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # Neo4j Browser HTTP UI
      - "7687:7687"   # Bolt Protocol (used by Python code)
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Redis Session Cache
  # In-memory cache for tracking visited state-action pairs (deduplication)
  redis:
    image: redis:7-alpine
    container_name: statescout-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"   # Redis default port
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # FastAPI Reporting Backend & Web Audit Console
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: statescout-api
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-testpassword123}
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  redis_data:
    driver: local
