name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  validate-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch name
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Branch: $BRANCH"

          if [[ "$BRANCH" == "main" || "$BRANCH" == "staging" ]]; then
            exit 0
          fi

          if [[ ! "$BRANCH" =~ ^(feature|fix|hotfix|release|chore)/[a-z0-9-]+$ ]]; then
            echo "Invalid branch name!"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: validate-branch

    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install
        run: bun install

      - name: Lint (non-blocking)
        run: bun run lint
        continue-on-error: true

      - name: Unit Tests
        run: bun test

      - name: Build (non-blocking)
        run: bun run build
        continue-on-error: true

      - name: E2E (non-blocking)
        run: bun run e2e
        continue-on-error: true

      - name: Done
        if: always()
        run: echo "Done :)"

      - name: On failure
        if: failure()
        run: echo "Pipeline failed :("