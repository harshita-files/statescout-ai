name: Docs

# Builds the documentation portal (mkdocs.yml, docs/portal) on every relevant
# change, and publishes it to GitHub Pages from the branches listed under `push`.

on:
  push:
    # Drop feature/D-docs-portal once the portal is merged.
    branches: [main, feature/D-docs-portal]
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - '**/README.md'
      - 'apps/**/*.py'
      - 'services/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - '**/README.md'
      - 'apps/**/*.py'
      - 'services/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --frozen --no-dev --group docs

      - name: Build (strict — a broken link or missing include fails the build)
        run: uv run --frozen --no-dev --group docs mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: '1'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
