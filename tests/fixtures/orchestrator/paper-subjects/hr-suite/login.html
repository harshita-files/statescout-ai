<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRSuite - Employee Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .login-box { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #1565c0; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>HRSuite</h1>
        <p>Employee & Payroll Portal</p>
        <form>
            <input type="text" placeholder="Employee ID">
            <input type="password" placeholder="Password">
            <button onclick="location.href='dashboard.html'">Sign In</button>
        </form>
        <p style="text-align: center; font-size: 12px; color: #666;">For urgent HR matters, contact HR@company.com</p>
    </div>
</body>
</html>
