<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConfigHub - Account Setup</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); width: 100%; max-width: 380px; }
        h1 { color: #333; text-align: center; margin-top: 0; }
        .tagline { text-align: center; color: #666; font-size: 14px; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: 600; }
        button:hover { background: #5568d3; }
        .signup { text-align: center; margin-top: 15px; font-size: 14px; }
        .signup a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>ConfigHub</h1>
        <div class="tagline">Unified account management platform</div>
        <form>
            <input type="email" placeholder="Email address">
            <input type="password" placeholder="Password">
            <button onclick="location.href='home.html'">Sign In</button>
        </form>
        <div class="signup">
            New to ConfigHub? <a href="#">Create an account</a>
        </div>
    </div>
</body>
</html>
